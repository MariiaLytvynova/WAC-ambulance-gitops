apiVersion: polyfea.github.io/v1alpha1
kind: WebComponent
metadata:
  name: ml-ambulance-content
spec:
  microFrontend: ml-ambulance
  element: ml-change
  attributes:
  
    - name: base-path
      value: /ml-ambulance-wl/ 
    - name: api-base
      # value: http://localhost:5000/api
      # value: http://localhost:30081/api
      value: /ml-api      
    - name: ambulance-id
      value: bobulova 
  displayRules:
    - allOf:
      - context-name: main-content
      - path: "^(\\.?/)?ml-ambulance-wl(/.*)?$" #ukaze sa len pri url, která obsahuje ml-ambulance-wl